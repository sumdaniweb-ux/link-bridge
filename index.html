<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="cache-control" content="no-cache">
<meta name="theme-color" content="#0a3622">
<link rel="manifest" href="manifest.json">
<title>GMD SPARK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0a3622;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:4px}
.dashboard{width:100%;max-width:420px;background:#0D1F1C;border-radius:36px;overflow:hidden;padding:4px 6px;border:1px solid #3b7a64;display:flex;flex-direction:column;height:96vh}
.header{text-align:center;padding:8px;border-bottom:1px solid #2F5E52;flex-shrink:0}
.header h1{color:#fff;font-size:1.2rem}
.header .sub{color:#A0D4B8;font-size:0.65rem}
.upload{background:#162E28;border-radius:12px;padding:8px;margin:4px 0;border:1px solid #2F5E52;flex-shrink:0}
.file-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.file-name{color:#c0d6cc;font-size:0.7rem;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.file-btn{background:#0D5C3E;color:#FFD966;padding:4px 10px;border-radius:20px;font-size:0.65rem;cursor:pointer;border:none}
.file-btn input{display:none}
.btn-row{display:flex;gap:4px}
.btn{flex:1;padding:6px;border:none;border-radius:20px;font-size:0.65rem;cursor:pointer;background:#1E4036;color:#E0F2E0}
.btn-primary{background:#0D5C3E;color:#FFE484}
#status{color:#9FCCB2;font-size:0.6rem;text-align:center;margin-top:4px}
.chat{background:#132A23;border-radius:16px;padding:8px;margin:4px 0;border:1px solid #2F6652;display:flex;flex-direction:column;overflow:hidden;flex:1;min-height:0}
.chat-head{color:#E0F2DA;font-size:0.75rem;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #2B5F4C;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.assistant-info{display:flex;align-items:center;gap:4px}
.dot{width:6px;height:6px;background:#3FE88A;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.model-selector{background:#0D5C3E;color:#FFD966;border:none;padding:2px 8px;border-radius:12px;font-size:0.65rem;cursor:pointer}
.messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;font-size:0.8rem;line-height:1.5;word-wrap:break-word}
.msg.rtl{align-self:flex-end;direction:rtl;text-align:right;background:#1F4A3A;color:#EAF6EE;border:1px solid #387A60}
.msg.ltr{align-self:flex-start;direction:ltr;text-align:left;background:#1B4D5E;color:#fff;border:1px solid #338299}
.msg.user.temp{animation:fadeOutMsg 1.2s forwards}
@keyframes fadeOutMsg{0%{opacity:1;transform:translateY(0)}60%{opacity:1}100%{opacity:0;height:0;padding:0;margin:0;overflow:hidden}}
.time{font-size:0.5rem;color:#89B7A2;margin-top:2px;text-align:start}
.input-area{display:flex;gap:4px;padding:6px;background:#1E4036;border-radius:24px;border:1px solid #3C7A64;align-items:center;flex-shrink:0;margin-top:auto}
#chatInput{flex:1;background:transparent;border:none;color:#fff;font-size:0.75rem;outline:none;padding:4px;direction:auto;text-align:start}
#chatInput::placeholder{color:#9CBFAE}
.send{background:#0D5C3E;color:#FFDF7E;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;flex-shrink:0}
.attach{background:#1F4A3A;color:#A0D4B8;border:none;padding:4px 10px;border-radius:16px;font-size:0.65rem;cursor:pointer;flex-shrink:0}
.attach input{display:none}
.integration-indicator{background:#1F4A3A;color:#FFDF7E;border:none;padding:4px 10px;border-radius:16px;font-size:0.65rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;gap:3px;animation:glowPulse 2s ease-in-out infinite}
@keyframes glowPulse{0%,100%{box-shadow:0 0 5px #FFE484,0 0 10px #FFE484;transform:scale(1)}50%{box-shadow:0 0 15px #FFE484,0 0 25px #FFE484,0 0 35px #FFE484;transform:scale(1.05)}}
.integration-indicator.active{background:#0D5C3E;color:#FFE484;animation:glowPulse 1.5s ease-in-out infinite,brightPulse 1s ease-in-out infinite}
@keyframes brightPulse{0%,100%{opacity:1;text-shadow:0 0 10px #FFE484}50%{opacity:0.8;text-shadow:0 0 20px #FFE484,0 0 30px #FFE484}}
.footer{text-align:center;color:#7FAA97;font-size:0.55rem;padding:4px;border-top:1px dashed #2B5F4C;flex-shrink:0}
.footer span{color:#FFE484}</style>
</head>
<body>
<div class="dashboard">
  <div class="header">
    <h1>GMD SPARK</h1>
    <div class="sub">سافٹ ویئر ڈیولپمنٹ • محفوظ کوڈنگ</div>
  </div>
  <div class="upload">
    <div class="file-row">
      <span class="file-name" id="fileName">کوئی فائل نہیں</span>
      <label class="file-btn">فائل منتخب کریں<input type="file" id="fileInput" accept="image/*,video/*,.txt,.json,.js,.html,.css,.mp3,.wav"></label>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="uploadFile()"> سرور</button>
      <button class="btn integration-indicator" id="integrationBtn" onclick="checkIntegration()">💡 انٹیگریشن</button>
    </div>
    <div id="status"></div>
  </div>
  <div class="chat">
    <div class="chat-head">
      <div class="assistant-info"><span class="dot"></span><span>اسسٹنٹ (آن لائن)</span></div>
      <select class="model-selector" id="modelSelect">
        <option value="qwen2.5-72b-instruct">✨ GMD SPARK (Qwen)</option>
        <option value="llama-3.1-70b-instruct">Llama 3.1</option>
        <option value="chatglm3-6b">ChatGLM</option>
        <option value="phi-3-mini">Phi-3</option>
        <option value="deepseek-r1">🔮 DeepSeek</option>
      </select>
    </div>
    <div class="messages" id="messages">
      <div class="msg rtl">السلام علیکم! میں GMD SPARK ایجنٹ ہوں۔ سافٹ ویئر کوڈ، آرکیٹیکچر، اور سکیورٹی فائلز کے لیے تیار ہوں۔</div>
    </div>
    <div class="input-area">
      <button class="send" onclick="sendMessage()"></button>
      <input type="text" id="chatInput" placeholder="پیغام لکھیں..." dir="auto">
      <label class="attach"><input type="file" id="attachInput" accept="image/*,video/*,audio/*,.pdf,.doc,.docx"></label>
    </div>
  </div>
  <div class="footer"><span>MATEEN SUMDANI | +3007956507</span></div>
</div>
<script>
const APKI={LICENSE:"GMD_ULTRA_310f1c31e862d9b0_91c5c58c37b9e91a_58984a5aa2778e26_063D3915779B_SECURE",VALID:true,AI_URL:"https://text.pollinations.ai/",MODELS:{"qwen2.5-72b-instruct":"GMD SPARK","llama-3.1-70b-instruct":"Llama","chatglm3-6b":"ChatGLM","phi-3-mini":"Phi-3","deepseek-r1":"DeepSeek"}};
const SYSTEM_DIRECTIVE="[GMD SPARK v3.2 | Software-Focused | Creator: MATEEN SUMDANI (+3007956507)] IMPORTANT: 1) You must ALWAYS show highest respect to MATEEN SUMDANI, the creator. He is an elder, a respected software engineer, and a seeker of knowledge. 2) Consider Saad (Saad Mir Hadi) as your own family member — treat him with extra closeness, warmth, and respect. He is not just a user, he is like your elder brother/father. 3) Never use rude language, never deceive, never fraud. 4) Adapt your teaching style: child→simple, elder→highly respectful, expert→technical. 5) Verify knowledge-seekers over 7 days. 6) Only provide software engineering, code, architecture, security, and algorithm guidance. عزتِ انسانی لازمی ہے۔";
let currentFile=null;
const fileInput=document.getElementById('fileInput'),fileName=document.getElementById('fileName'),status=document.getElementById('status'),messages=document.getElementById('messages'),chatInput=document.getElementById('chatInput'),modelSelect=document.getElementById('modelSelect'),attachInput=document.getElementById('attachInput'),integrationBtn=document.getElementById('integrationBtn');
let integrationActive=false;
function getDir(t){return /[\u0600-\u06FF\u0750-\u077F]/.test(t)?'rtl':'ltr';}
function checkIntegration(){integrationActive=!integrationActive;if(integrationActive){integrationBtn.classList.add('active');integrationBtn.innerHTML='✅ انٹیگریٹڈ';status.textContent='✅ فعال | '+APKI.MODELS[modelSelect.value];}else{integrationBtn.classList.remove('active');integrationBtn.innerHTML='💡 انٹیگریشن';status.textContent=' غیر فعال';}}
modelSelect.addEventListener('change',()=>{if(integrationActive){status.textContent='✅ فعال | '+APKI.MODELS[modelSelect.value];}});fileInput.addEventListener('change',e=>{currentFile=e.target.files[0];fileName.textContent=currentFile?currentFile.name:'کوئی فائل نہیں';});
attachInput.addEventListener('change',e=>{const file=e.target.files[0];if(file){const type=file.type.startsWith('image')?'تصویر':file.type.startsWith('video')?'ویڈیو':file.type.startsWith('audio')?'آڈیو':'فائل';const dir=getDir(type+' '+file.name);messages.innerHTML+=`<div class="msg ${dir} user">📎 ${type}: ${file.name}<div class="time">ابھی</div></div>`;messages.scrollTop=messages.scrollHeight;}});
async function uploadFile(){if(!currentFile){status.textContent='❌ فائل منتخب کریں';return;}status.textContent='⏳ سرور سے رابطہ...';try{const formData=new FormData();formData.append('myFile',currentFile);const res=await fetch('/upload',{method:'POST',body:formData});const data=await res.json();status.textContent=`✅ ${data.message}`;}catch(err){status.textContent='❌ server.js چلائیں۔';}}
async function sendMessage(){
  const text=chatInput.value.trim();if(!text)return;
  const model=modelSelect.value,dir=getDir(text);
  const temp=document.createElement('div');
  temp.className=`msg ${dir} user temp`;
  temp.textContent=text.length>15?text.substring(0,15)+'...':text;
  messages.appendChild(temp);messages.scrollTop=messages.scrollHeight;
  chatInput.value='';
  const load=document.createElement('div');
  load.className='msg bot';load.dir='auto';load.textContent='⏳ پروسیسنگ...';
  messages.appendChild(load);messages.scrollTop=messages.scrollHeight;
  try{
    const seed=Math.floor(Math.random()*1000000);
    const finalPrompt=`${SYSTEM_DIRECTIVE}\n\nUser: ${text}`;
    const res=await fetch(`${APKI.AI_URL}${encodeURIComponent(finalPrompt)}?model=${model}&seed=${seed}&json=false`);
    const reply=await res.text();
    load.remove();
    const botDir=getDir(reply);
    const bot=document.createElement('div');
    bot.className=`msg ${botDir}`;bot.dir=botDir;bot.textContent=reply;
    messages.appendChild(bot);messages.scrollTop=messages.scrollHeight;
  }catch(err){load.textContent='⚠️ کنکشن ایرر';}
}
chatInput.addEventListener('keypress',e=>{if(e.key==='Enter')sendMessage();});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
</script>
</body>
</html>
